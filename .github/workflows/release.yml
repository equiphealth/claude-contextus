name: Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & Type Check
        run: |
          pnpm lint
          pnpm type-check

      - name: Run tests
        run: pnpm test
        env:
          NODE_OPTIONS: --experimental-vm-modules

      - name: Build
        run: pnpm build

      - name: Package plugin
        run: |
          mkdir -p _package
          # Runtime JS (built)
          cp -r dist/ _package/dist/
          # Hook scripts (plain JS, run directly by Claude Code)
          cp -r scripts/ _package/scripts/
          # Plugin manifests
          cp plugin.json _package/
          cp package.json _package/
          cp pnpm-lock.yaml _package/
          # Skills (discovered by Claude Code from skills/ dir)
          cp -r skills/ _package/skills/
          # Hooks config
          cp -r hooks/ _package/hooks/
          # Templates
          cp -r templates/ _package/templates/
          # TypeScript source — included so isDevMode() tsx fallback works when
          # dist/ is absent or incomplete. Production runs dist/ JS; source is
          # only loaded if the build failed or the user forces CONTEXTUS_DEV=1.
          cp -r daemon/ _package/daemon/
          cp -r lib/ _package/lib/
          # Create tarball
          tar -czf claude-contextus-plugin.tar.gz -C _package .
          echo "✓ Package created: $(du -h claude-contextus-plugin.tar.gz | cut -f1)"

      # Tagged releases: create a GitHub Release with the tarball
      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/v')
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          cat > CHANGELOG.txt << EOF
          ## What's Changed

          ${COMMITS}

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${{ steps.version.outputs.VERSION }}
          EOF

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          body_path: CHANGELOG.txt
          draft: false
          prerelease: false
          files: |
            claude-contextus-plugin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Main branch pushes: update the "latest" pre-release
      - name: Update latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest (main)
          body: |
            Auto-built from the latest commit on `main`.

            **Install**: Download `claude-contextus-plugin.tar.gz` and extract to your plugin directory.

            **Commit**: ${{ github.sha }}
            **Built**: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: true
          files: |
            claude-contextus-plugin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
