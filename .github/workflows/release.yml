name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & Type Check
        run: |
          pnpm lint
          pnpm type-check

      - name: Run tests
        run: pnpm test
        env:
          NODE_OPTIONS: --experimental-vm-modules

      - name: Build
        run: pnpm build

      - name: Package plugin
        run: |
          mkdir -p _package
          cp -r dist/ _package/dist/
          cp -r scripts/ _package/scripts/
          # Plugin manifests
          cp plugin.jsonc _package/
          cp package.json _package/
          cp pnpm-lock.yaml _package/
          cp -r skills/ _package/skills/
          cp -r hooks/ _package/hooks/
          cp -r templates/ _package/templates/
          # TypeScript source — included so isDevMode() tsx fallback works when
          # dist/ is absent or incomplete. Production runs dist/ JS; source is
          # only loaded if the build failed or the user forces CONTEXTUS_DEV=1.
          cp -r daemon/ _package/daemon/
          cp -r lib/ _package/lib/
          tar -czf claude-contextus-plugin.tar.gz -C _package .
          echo "✓ Package created: $(du -h claude-contextus-plugin.tar.gz | cut -f1)"

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version tag already exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          fi

      # Versioned release: only when package.json version is new (PR bumped it)
      - name: Generate changelog
        if: steps.tag_check.outputs.EXISTS == 'false'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          cat > CHANGELOG.txt << EOF
          ## What's Changed

          ${COMMITS}

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${{ steps.version.outputs.VERSION }}
          EOF

      - name: Create versioned release
        if: steps.tag_check.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body_path: CHANGELOG.txt
          draft: false
          prerelease: false
          files: |
            claude-contextus-plugin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Latest pre-release: always updated on every main push
      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest (main)
          body: |
            Auto-built from the latest commit on `main`.

            **Install**: Download `claude-contextus-plugin.tar.gz` and extract to your plugin directory.

            **Version**: ${{ steps.version.outputs.VERSION }}
            **Commit**: ${{ github.sha }}
            **Built**: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: true
          files: |
            claude-contextus-plugin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
