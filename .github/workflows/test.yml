name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm type-check

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Verify version lockstep
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          # plugin.jsonc has inline comments — strip them with a simple state machine
          PLUGIN_VERSION=$(node -e "
            const fs = require('fs');
            const text = fs.readFileSync('plugin.jsonc', 'utf8');
            let r = '', i = 0;
            while (i < text.length) {
              if (text[i] === '\"') { r += '\"'; i++;
                while (i < text.length && text[i] !== '\"') { if (text[i] === '\\\\') r += text[i++]; r += text[i++]; }
                if (i < text.length) r += text[i++];
              } else if (text[i] === '/' && text[i+1] === '/') { i += 2; while (i < text.length && text[i] !== '\n') i++;
              } else if (text[i] === '/' && text[i+1] === '*') { i += 2; while (i < text.length && !(text[i] === '*' && text[i+1] === '/')) i++; i += 2;
              } else { r += text[i++]; }
            }
            console.log(JSON.parse(r).version);
          ")
          echo "package.json:               $PKG_VERSION"
          echo "plugin.jsonc:               $PLUGIN_VERSION"
          echo ".claude-plugin/plugin.json: $MANIFEST_VERSION"
          if [ "$PKG_VERSION" != "$PLUGIN_VERSION" ] || [ "$PKG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Version mismatch! All three files must have the same version."
            exit 1
          fi
          echo "✓ All versions in sync: $PKG_VERSION"

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          NODE_OPTIONS: --experimental-vm-modules

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: pnpm build

      - name: Verify dist/ was produced
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist/ directory not created by build"
            exit 1
          fi
          echo "✓ Build produced dist/"
