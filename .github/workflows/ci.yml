name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm type-check

      - name: Check formatting
        run: pnpm exec prettier --check "lib/**/*.ts" "scripts/**/*.ts" "daemon/**/*.ts" "*.json"

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          NODE_OPTIONS: --experimental-vm-modules

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: pnpm build

      - name: Verify committed dist/ is fresh
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist/ directory not created"
            exit 1
          fi
          # dist/ is committed (packaging: marketplace clones run node dist/...).
          # A rebuild must produce no diff — otherwise the committed dist is stale.
          if ! git diff --quiet -- dist; then
            echo "Error: committed dist/ is stale. Run 'pnpm build' and commit dist/."
            git diff --stat -- dist
            exit 1
          fi
          echo "✓ Committed dist/ is up to date"
